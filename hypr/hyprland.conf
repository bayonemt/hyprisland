env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER,vulkan

# tecla principal
$mod = SUPER

# terminal
bind = $mod, RETURN, exec, kitty

# fechar janela
bind = $mod, Q, killactive

# launcher
bind = $mod, D, exec, wofi --show drun

# mover foco
bind = SUPER SHIFT, right, movetoworkspace, +1
bind = SUPER SHIFT, left, movetoworkspace, -1

# mover entre janelas
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext

# tela cheia
bind = SUPER, M, fullscreen, 1

# apps ao iniciar
exec-once = waybar
exec-once = ~/.config/hypr/scripts/toggle-music-popup.sh --start-hidden
exec-once = ~/.config/hypr/scripts/toggle-calendar-popup.sh --start-hidden
exec-once = mako

# explorador de arquivos
bind = SUPER, E, exec, thunar

# print
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# area de tranferencia
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# tela de bloqueio
bind = SUPER, L, exec, hyprctl dispatch exit

# arrastar janelas
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# wallpaper
# exec-once = hyprpaper

# mostrar area de trabalho
bind = SUPER, B, workspace, 10
bind = SUPER SHIFT, B, workspace, previous

# abrir apps
bind = CTRL, F1, exec, DiscordCanary --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = CTRL, F2, exec, firefox

# controlar volume pela rodinha do teclado
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# definir wallpaper
exec-once = swww-daemon --format xrgb
bind = $mod, W, exec, ~/.config/hypr/scripts/wallpaper-selector-quickshell.sh

# fechar o app a força
bind = SUPER_SHIFT, Q, exec, ~/.config/hypr/scripts/superkill.sh

# notificacao
exec-once = mako

# opcoes de energia
bind = SUPER, ESCAPE, exec, wlogout

bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

input {
    kb_layout = br
    kb_variant = abnt2
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}
bind = SUPER, F12, exec, notify-send TESTE
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1

# Music popup window rules (Quickshell qs-music-popup)
# 270 = 41 (tab bar) + 207 (altura real medida do conteúdo da aba de Música)
# + folga. O Quickshell não redimensiona essa janela ao vivo nesse setup,
# então o tamanho tem que já vir certo daqui.
windowrulev2 = float, title:^(music-popup)$
windowrulev2 = size 380 270, title:^(music-popup)$
windowrulev2 = move 770 54, title:^(music-popup)$
windowrulev2 = pin, title:^(music-popup)$
windowrulev2 = noborder, title:^(music-popup)$
windowrulev2 = noshadow, title:^(music-popup)$
windowrulev2 = rounding 20, title:^(music-popup)$
windowrulev2 = noblur, title:^(music-popup)$
windowrulev2 = opaque, title:^(music-popup)$

# Calendar popup window rules (Quickshell qs-calendar-popup)
windowrulev2 = float, title:^(calendar-popup)$
windowrulev2 = size 300 336, title:^(calendar-popup)$
windowrulev2 = move 810 54, title:^(calendar-popup)$
windowrulev2 = pin, title:^(calendar-popup)$
windowrulev2 = noborder, title:^(calendar-popup)$
windowrulev2 = noshadow, title:^(calendar-popup)$
windowrulev2 = rounding 20, title:^(calendar-popup)$
windowrulev2 = noblur, title:^(calendar-popup)$
windowrulev2 = opaque, title:^(calendar-popup)$

# Wallpaper selector window rules (Quickshell qs-wallpaper-picker)
windowrulev2 = float, class:^(quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = center, class:^(quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = pin, class:^(quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = noborder, class:^(quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = noshadow, class:^(quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = rounding 20, class:^(quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = noblur, class:^(quickshell)$, title:^(wallpaper-picker)$
windowrulev2 = opaque, class:^(quickshell)$, title:^(wallpaper-picker)$
# Fallbacks caso class ou title sejam diferentes
windowrulev2 = float, title:^(wallpaper-picker)$
windowrulev2 = center, title:^(wallpaper-picker)$
windowrulev2 = pin, title:^(wallpaper-picker)$
windowrulev2 = noborder, title:^(wallpaper-picker)$
windowrulev2 = noshadow, title:^(wallpaper-picker)$
windowrulev2 = rounding 20, title:^(wallpaper-picker)$
windowrulev2 = noblur, title:^(wallpaper-picker)$
windowrulev2 = opaque, title:^(wallpaper-picker)$

# Waypaper window rules
windowrulev2 = float, class:^(waypaper)$
windowrulev2 = size 850 520, class:^(waypaper)$
windowrulev2 = center, class:^(waypaper)$
windowrulev2 = pin, class:^(waypaper)$
windowrulev2 = noborder, class:^(waypaper)$
windowrulev2 = noshadow, class:^(waypaper)$
windowrulev2 = rounding 20, class:^(waypaper)$

# ============================================
# WayDroid window rules - fix mouse/input offset
# ============================================
windowrulev2 = float, class:^(Waydroid)$
windowrulev2 = size 576 1024, class:^(Waydroid)$
windowrulev2 = center, class:^(Waydroid)$
windowrulev2 = pin, class:^(Waydroid)$
windowrulev2 = noborder, class:^(Waydroid)$
windowrulev2 = noshadow, class:^(Waydroid)$
windowrulev2 = noblur, class:^(Waydroid)$
windowrulev2 = opaque, class:^(Waydroid)$
windowrulev2 = rounding 0, class:^(Waydroid)$
windowrulev2 = bordersize 0, class:^(Waydroid)$
windowrulev2 = nomaxsize, class:^(Waydroid)$
windowrulev2 = suppressevent maximize, class:^(Waydroid)$
windowrulev2 = suppressevent fullscreen, class:^(Waydroid)$
